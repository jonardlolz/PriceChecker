# Every push to main: deploy on the production laptop (the self-hosted runner labelled
# `pricechecker-prod`). deploy/deploy.sh builds the release and runs the smoke test on it
# before switching over, so a failing test never goes live. Can also be started by hand
# from the Actions tab ("Run workflow"), e.g. to redeploy.
#
# Security: the self-hosted runner only ever runs this workflow, which only triggers on pushes
# to main (needs write access) or manual runs. Pull requests never reach the laptop.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running deploy instead of interrupting it.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, pricechecker-prod]
    timeout-minutes: 15
    environment:
      name: production
      url: https://prices.kregjonard.fun
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: bash deploy/deploy.sh
